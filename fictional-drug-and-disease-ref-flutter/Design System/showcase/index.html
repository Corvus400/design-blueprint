<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Design System · Component Composition Showcase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="colors_and_type.css" />
    <link rel="stylesheet" href="disclaimer-ribbon.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: var(--font-jp);
        background: #f0eee9;
        color: var(--ink);
      }
      /* Hide native scrollbars in artboard content */
      *::-webkit-scrollbar {
        display: none;
      }
      * {
        scrollbar-width: none;
      }
      /* Material Symbols sizing */
      .material-symbols-outlined {
        display: inline-block;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="design-canvas.jsx"></script>
    <script type="text/babel" src="Components.jsx"></script>
    <script type="text/babel" src="showcase.jsx"></script>
  </body>
</html>
