<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 14px 8px;
      }
      .ico {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--fg);
      }
      .ico .material-symbols-outlined {
        font-size: 24px;
        color: #1a1c1e;
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .nm {
        font: var(--t-label-s);
        color: var(--fg-muted);
      }
    </style>
    <title>Iconography — Preview</title>
  </head>
  <body>
    <div class="grid">
      <div class="ico">
        <span class="material-symbols-outlined">search</span>
        <span class="nm">search</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">close</span>
        <span class="nm">close</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">bookmark</span>
        <span class="nm">bookmark</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">history</span>
        <span class="nm">history</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">calculate</span>
        <span class="nm">calc</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">tune</span>
        <span class="nm">tune</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">chevron_right</span>
        <span class="nm">chevron</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">expand_more</span>
        <span class="nm">expand</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">refresh</span>
        <span class="nm">retry</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">warning_amber</span>
        <span class="nm">warn</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">info</span>
        <span class="nm">info</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">more_vert</span>
        <span class="nm">more</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">share</span>
        <span class="nm">share</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="nm">back</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">filter_list</span>
        <span class="nm">filter</span>
      </div>
      <div class="ico">
        <span class="material-symbols-outlined">check_circle</span>
        <span class="nm">check</span>
      </div>
    </div>
  </body>
</html>
