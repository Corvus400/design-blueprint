<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 14px;
        background: var(--bg);
      }
      .card {
        background: var(--surface);
        border: 0.5px solid var(--hairline);
        border-radius: 10px;
        padding: 12px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 5px;
      }
      .chip {
        padding: 2px 7px;
        border-radius: 5px;
        font: 700 11px/1.5 var(--font-jp);
      }
      .name {
        font: var(--t-title-m);
        color: var(--fg);
      }
      .reading {
        font: var(--t-body-s);
        color: var(--fg-muted);
      }
      .meta {
        display: flex;
        gap: 12px;
        font: var(--t-label-m);
        color: var(--fg-muted);
        margin-top: 2px;
      }
    </style>
    <title>Component Disease Card — Preview</title>
  </head>
  <body data-frame-label="document">
    <div
      hidden
      data-codex-repo-wide-implementation-readiness="source-plus-rendered-evidence"
      data-implementation-parity-scope="repo-wide-html-design-artifact"
    >
      Repo-wide implementation readiness gate. implementation source evidence + rendered frame evidence. Do not use VRT
      or visual manifest as implementation parity evidence by itself.
    </div>
    <div class="card">
      <div class="col">
        <div class="chips">
          <span class="chip" style="background: rgba(180, 83, 9, 0.05); color: #9c4708">慢性</span>
          <span class="chip" style="background: rgba(15, 118, 110, 0.05); color: #0c5f5a">非感染性</span>
          <span class="chip" style="background: rgba(29, 78, 216, 0.05); color: #1742a8">内科</span>
          <span class="chip" style="background: rgba(77, 124, 15, 0.05); color: #3d640c">循環器科</span>
        </div>
        <div class="name">ヒソネナ</div>
        <div class="reading">ほんたいせいこうけつあつしょう</div>
        <div class="meta">
          <span>ICD-10: IX 循環器系</span>
          <span>改訂 2024-09-02</span>
        </div>
      </div>
    </div>
  </body>
</html>
