<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 14px 16px;
        background: var(--surface);
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 6px 0;
        border-bottom: 0.5px solid var(--hairline);
      }
      .row:last-child {
        border-bottom: none;
      }
      .tok {
        font: var(--t-mono-s);
        color: var(--fg-muted);
        flex: 0 0 100px;
      }
      .meta {
        font: var(--t-label-m);
        color: var(--fg-muted);
        flex: 0 0 76px;
      }
      .spec {
        color: var(--fg);
      }
    </style>
    <title>Type Body Meta — Preview</title>
  </head>
  <body>
    <div class="row">
      <div class="tok">--t-body-l</div>
      <div class="meta">400 · 15 / 23</div>
      <div class="spec" style="font: var(--t-body-l)">ヒソネナ、ルチクラルイの患者に対し用いる 架空分類。</div>
    </div>
    <div class="row">
      <div class="tok">--t-body-m</div>
      <div class="meta">400 · 14 / 22</div>
      <div class="spec" style="font: var(--t-body-m)">
        通常、成人にはトレデキムとして 1 日 1 回 2.5〜5 mg を経口投与する。
      </div>
    </div>
    <div class="row">
      <div class="tok">--t-body-s</div>
      <div class="meta">400 · 13 / 20</div>
      <div class="spec" style="font: var(--t-body-s)">あむろじんじょう・ごみりぐらむ</div>
    </div>
    <div class="row">
      <div class="tok">--t-label-m</div>
      <div class="meta">500 · 12 / 17</div>
      <div class="spec" style="font: var(--t-label-m); color: var(--fg-muted)">ATC: C08CA01 · 改訂 2024-08-12</div>
    </div>
    <div class="row">
      <div class="tok">--t-label-s</div>
      <div class="meta">600 · 11 / 15</div>
      <div class="spec" style="font: var(--t-label-s)">5%以上</div>
    </div>
    <div class="row">
      <div class="tok">--t-mono-s</div>
      <div class="meta">400 · 11 / 15</div>
      <div class="spec" style="font: var(--t-mono-s)">YJ: 2149009F1031</div>
    </div>
  </body>
</html>
