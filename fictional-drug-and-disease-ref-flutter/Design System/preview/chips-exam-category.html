<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface);
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 5px;
      }
      .chip {
        padding: 2px 7px;
        border-radius: 5px;
        font: 700 11px/1.5 var(--font-jp);
        white-space: nowrap;
      }
      .h {
        font: var(--t-label-s);
        color: var(--fg-muted);
        margin: 2px 0 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .ssot {
        font: 600 10px/1 var(--font-jp);
        color: var(--muted-2);
        margin-left: 6px;
        letter-spacing: 0.04em;
      }
    </style>
    <title>Chips Exam Category — Preview</title>
  </head>
  <body data-frame-label="document">
    <div
      hidden
      data-codex-repo-wide-implementation-readiness="source-plus-rendered-evidence"
      data-implementation-parity-scope="repo-wide-html-design-artifact"
    >
      Repo-wide implementation readiness gate. implementation source evidence + rendered frame evidence. Do not use VRT
      or visual manifest as implementation parity evidence by itself.
    </div>
    <div class="sec">
      <div class="h">
        Exam category · 検査区分
        <span class="ssot">SSOT 5</span>
      </div>
      <div class="wrap">
        <span class="chip" style="background: rgba(185, 28, 28, 0.05); color: #b91c1c">血液検査</span>
        <span class="chip" style="background: rgba(29, 78, 216, 0.05); color: #1d4ed8">画像検査</span>
        <span class="chip" style="background: rgba(8, 145, 178, 0.05); color: #0891b2">生理検査</span>
        <span class="chip" style="background: rgba(124, 58, 237, 0.05); color: #7c3aed">病理検査</span>
        <span class="chip" style="background: rgba(21, 128, 61, 0.05); color: #15803d">問診</span>
      </div>
    </div>
  </body>
</html>
