<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface);
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 5px;
      }
      .chip {
        padding: 2px 7px;
        border-radius: 5px;
        font: 700 11px/1.5 var(--font-jp);
        white-space: nowrap;
      }
      .h {
        font: var(--t-label-s);
        color: var(--fg-muted);
        margin: 2px 0 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sec {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .ssot {
        font: 600 10px/1 var(--font-jp);
        color: var(--muted-2);
        margin-left: 6px;
        letter-spacing: 0.04em;
      }
    </style>
    <title>Chips Precaution — Preview</title>
  </head>
  <body data-frame-label="document">
    <div
      hidden
      data-codex-repo-wide-implementation-readiness="source-plus-rendered-evidence"
      data-implementation-parity-scope="repo-wide-html-design-artifact"
    >
      Repo-wide implementation readiness gate. implementation source evidence + rendered frame evidence. Do not use VRT
      or visual manifest as implementation parity evidence by itself.
    </div>
    <div class="sec">
      <div class="h">
        Precaution population · 患者背景
        <span class="ssot">SSOT 8</span>
      </div>
      <div class="wrap">
        <span class="chip" style="background: rgba(75, 85, 99, 0.05); color: #4b5563">合併症</span>
        <span class="chip" style="background: rgba(161, 98, 7, 0.05); color: #a16207">腎機能障害</span>
        <span class="chip" style="background: rgba(202, 138, 4, 0.05); color: #ca8a04">肝機能障害</span>
        <span class="chip" style="background: rgba(190, 24, 93, 0.05); color: #be185d">生殖能有する患者</span>
        <span class="chip" style="background: rgba(159, 18, 57, 0.05); color: #9f1239">妊婦</span>
        <span class="chip" style="background: rgba(109, 40, 217, 0.05); color: #6d28d9">授乳婦</span>
        <span class="chip" style="background: rgba(21, 128, 61, 0.05); color: #15803d">小児等</span>
        <span class="chip" style="background: rgba(29, 78, 216, 0.05); color: #1d4ed8">高齢者</span>
      </div>
    </div>
  </body>
</html>
