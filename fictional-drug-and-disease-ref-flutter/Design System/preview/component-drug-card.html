<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      /* Mirrors lib/ui/search/widgets/drug_result_card.dart + AppPalette.regulatoryBadgeColors.
     Card radius = SearchConstants.searchCardRadius (10).
     Image = 56 x 84 (56 / (2/3) aspect-ratio), surfaceSubtle bg + hairline border, medication_outlined fallback.
     Card has EdgeInsets.only(top: 8). Padding(12). Row + Expanded(Column) + Wrap(spacing:5, runSpacing:4).
     Date: _formatRevisionDate replaces "-" with "/". */
      body {
        margin: 0;
        padding: 14px 16px;
        background: var(--bg);
        font-family: var(--font-jp);
      }
      .card {
        margin-top: 8px;
        background: var(--surface);
        border: 0.5px solid var(--hairline);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: stretch;
      }
      .img {
        width: 56px;
        height: 84px;
        border-radius: 8px;
        background: #efeff4; /* surfaceSubtle (light) */
        border: 0.5px solid rgba(60, 60, 67, 0.13); /* hairline */
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg-muted);
        flex: 0 0 auto;
        overflow: hidden;
      }
      .img svg {
        width: 24px;
        height: 24px;
      } /* Material Icons.medication_outlined size */
      .col {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 5px;
      } /* Wrap spacing:5 runSpacing:4 */
      .chip {
        padding: 2px 7px;
        border-radius: 5px;
        /* labelSmall + w700, ja line-height ~1.35 */
        font: 700 11px/1.35 var(--font-jp);
        white-space: nowrap;
      }
      /* Backgrounds = base @ 5% over surface (light). Foregrounds = base hex from AppPalette. */
      .c-prescription_required {
        background: rgba(10, 111, 232, 0.05);
        color: #0a6fe8;
      } /* drugInk */
      .c-potent {
        background: rgba(180, 83, 9, 0.05);
        color: #b45309;
      }
      .c-poison {
        background: rgba(214, 42, 42, 0.05);
        color: #d62a2a;
      } /* danger */
      .c-narcotic {
        background: rgba(147, 51, 234, 0.05);
        color: #9333ea;
      }
      .c-psychotropic {
        background: rgba(124, 58, 237, 0.05);
        color: #7c3aed;
      }
      .c-stimulant_precursor {
        background: rgba(234, 88, 12, 0.05);
        color: #ea580c;
      }
      .c-biological {
        background: rgba(15, 118, 110, 0.05);
        color: #0f766e;
      }
      .c-specified_biological {
        background: rgba(14, 116, 144, 0.05);
        color: #0e7490;
      }
      .c-ordinary {
        background: rgba(75, 85, 99, 0.05);
        color: #4b5563;
      }

      .brand {
        /* titleSmall, w700 */
        font: 700 14px/1.3 var(--font-jp);
        color: var(--fg);
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gen {
        /* bodySmall, onSurfaceVariant */
        font: 400 12px/1.45 var(--font-jp);
        color: var(--fg-muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px; /* Wrap spacing:12 */
        font: 500 11px/1.4 var(--font-jp); /* labelSmall */
        color: var(--fg-muted);
        margin-top: 5px;
      }
    </style>
    <title>Component Drug Card — Preview</title>
  </head>
  <body>
    <div class="card">
      <div class="img" aria-hidden="true">
        <!-- Material Icons.medication_outlined fallback (codebase _DrugImageFallback) -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="3" width="14" height="4" rx="1" />
          <path d="M6 7h12v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7Z" />
          <path d="M12 11v6M9 14h6" />
        </svg>
      </div>
      <div class="col">
        <div class="chips">
          <span class="chip c-prescription_required">処方箋医薬品</span>
          <span class="chip c-potent">劇薬</span>
        </div>
        <div class="brand">トレデキム</div>
        <div class="gen">トレデキム</div>
        <div class="meta">
          <span>ATC: C08CA01</span>
          <span>改訂 2024/08/12</span>
        </div>
      </div>
    </div>
  </body>
</html>
