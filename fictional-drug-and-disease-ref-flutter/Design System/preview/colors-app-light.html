<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--surface);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .lbl {
        font: var(--t-label-s);
        color: var(--fg-muted);
        margin-top: 6px;
        letter-spacing: 0.03em;
      }
      .val {
        font: var(--t-body-s);
        color: var(--fg);
      }
      .swatch {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sw {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 0.5px solid var(--hairline);
        flex: 0 0 auto;
      }
      .name {
        font: 700 12px/1.2 var(--font-jp);
        color: var(--fg);
      }
      .hex {
        font: var(--t-mono-s);
        color: var(--fg-muted);
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
    </style>
    <title>Colors App Light — Preview</title>
  </head>
  <body>
    <div class="grid">
      <div>
        <div class="swatch">
          <div class="sw" style="background: #007aff"></div>
          <div class="row">
            <div class="name">primary</div>
            <div class="hex">#007AFF</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: rgba(0, 122, 255, 0.1); border: 0.5px solid rgba(0, 122, 255, 0.35)"></div>
          <div class="row">
            <div class="name">primary-soft</div>
            <div class="hex">rgba(0,122,255,.10)</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #1a1c1e"></div>
          <div class="row">
            <div class="name">ink</div>
            <div class="hex">#1A1C1E</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #3f4347"></div>
          <div class="row">
            <div class="name">ink-2</div>
            <div class="hex">#3F4347</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #6c7177"></div>
          <div class="row">
            <div class="name">muted</div>
            <div class="hex">#6C7177</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #8e9298"></div>
          <div class="row">
            <div class="name">muted-2</div>
            <div class="hex">#8E9298</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #d62a2a"></div>
          <div class="row">
            <div class="name">danger</div>
            <div class="hex">#D62A2A</div>
          </div>
        </div>
      </div>
      <div>
        <div class="swatch">
          <div class="sw" style="background: #ffeded"></div>
          <div class="row">
            <div class="name">danger-cont</div>
            <div class="hex">#FFEDED</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
